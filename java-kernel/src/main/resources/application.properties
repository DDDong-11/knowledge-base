spring.application.name=kb-kernel

# 仅本机监听；端口可用 KB_PORT 覆盖
server.address=127.0.0.1
server.port=${KB_PORT:17321}

# 数据目录可用 KB_DATA_DIR 覆盖（或 --kb.data-dir=...）
kb.data-dir=${KB_DATA_DIR:${user.home}/.knowledge-base/data}

spring.datasource.url=jdbc:h2:file:${kb.data-dir}/kb
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false

# 表结构由 schema.sql 管理，Hibernate 只做校验
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-stacktrace=never
